<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actus | Hygie CrossFit Seclin</title>
  <meta name="description" content="Toutes les infos de la box qui ne doivent pas se perdre : tutos de l'appli, cycles de programmation, challenges et vie de la box.">
  <meta name="theme-color" content="#111111">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=17">
  <script src="assets/alerte.js?v=2" defer></script>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="./">
      <img src="assets/logo.svg" alt="Logo Hygie CrossFit">
    </a>
    <nav aria-label="Rubriques">
      <ul class="menu-rubriques" id="filtres"></ul>
    </nav>
  </header>


  <div class="wrap accueil">
    <section class="agenda" id="agenda" aria-labelledby="agenda-titre" hidden>
      <h2 class="section-titre" id="agenda-titre">L'<em>agenda</em></h2>
      <div class="agenda-liste" id="agenda-liste"></div>
    </section>

    <h2 class="section-titre">Les <em>actus</em></h2>

    <main>
      <section class="liste" id="liste" aria-live="polite" aria-label="Liste des articles"></section>
    </main>
  </div>

  <div class="visionneuse" id="visionneuse" role="dialog" aria-modal="true" aria-label="Visuel agrandi" hidden>
    <button class="visionneuse-fermer" type="button" aria-label="Fermer">×</button>
    <img alt="">
  </div>

  <footer class="site-footer">
    <img src="assets/logo.svg" alt="Logo Hygie CrossFit">
    <ul class="footer-nav">
      <li><a href="./">Les actus</a></li>
      <li><a href="articles/bien-demarrer-chez-hygie.html">Bien démarrer</a></li>
      <li><a href="https://www.crossfit-hygie.fr/#planning" target="_blank" rel="noopener">Planning</a></li>
    </ul>
    <p class="footer-legal">CrossFit&reg; Hygie · Seclin · Box affiliée CrossFit&reg;</p>
  </footer>

  <script src="articles.js?v=12"></script>
  <script src="evenements.js?v=2"></script>
  <script>
    /* L'agenda : les événements à venir, du plus proche au plus lointain.
       Un événement reste affiché jusqu'au soir de sa date, puis disparaît. */
    (function () {
      "use strict";
      if (typeof EVENEMENTS === "undefined") return;
      var aujourdhui = new Date(); aujourdhui.setHours(0, 0, 0, 0);
      var avenir = EVENEMENTS.filter(function (e) {
        return new Date(e.date + "T00:00:00") >= aujourdhui;
      }).sort(function (a, b) { return a.date.localeCompare(b.date); });
      if (!avenir.length) return;

      /* Visionneuse : un toucher sur le visuel l'ouvre en grand au premier plan ;
         un toucher n'importe où, la croix ou Échap la referment. */
      var vis = document.getElementById("visionneuse");
      var visImg = vis.querySelector("img");
      var dernierFocus = null;
      function ouvrir(src, alt) {
        dernierFocus = document.activeElement;
        visImg.src = src; visImg.alt = alt;
        vis.hidden = false;
        document.body.style.overflow = "hidden";
        vis.querySelector(".visionneuse-fermer").focus();
      }
      function fermer() {
        vis.hidden = true;
        document.body.style.overflow = "";
        if (dernierFocus) dernierFocus.focus();
      }
      vis.addEventListener("click", fermer);
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && !vis.hidden) fermer();
      });

      var jour = new Intl.DateTimeFormat("fr-FR", { weekday: "long" });
      var mois = new Intl.DateTimeFormat("fr-FR", { month: "short" });
      var liste = document.getElementById("agenda-liste");

      avenir.forEach(function (e) {
        var d = new Date(e.date + "T12:00:00");
        var carte = document.createElement("article");
        carte.className = "evenement" + (e.image ? "" : " sans-visuel");

        /* Vignette à gauche, carrée et identique pour tous : l'image la remplit
           (légèrement recadrée), un toucher l'ouvre en entier dans la visionneuse. */
        if (e.image) {
          var img = document.createElement("img");
          img.className = "evenement-visuel";
          img.src = e.image; img.alt = "Visuel : " + e.titre; img.loading = "lazy";
          img.tabIndex = 0; img.setAttribute("role", "button");
          img.title = "Agrandir le visuel";
          img.addEventListener("click", function () { ouvrir(e.image, img.alt); });
          img.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ouvrir(e.image, img.alt); }
          });
          carte.appendChild(img);
        }

        var texte = document.createElement("div");
        texte.className = "evenement-texte";

        var date = document.createElement("p");
        date.className = "evenement-date";
        date.textContent = jour.format(d) + " " + d.getDate() + " " + mois.format(d).replace(".", "");

        var h3 = document.createElement("h3"); h3.textContent = e.titre;
        var horaire = document.createElement("p"); horaire.className = "evenement-horaire"; horaire.textContent = e.horaire;
        var resume = document.createElement("p"); resume.className = "evenement-resume"; resume.textContent = e.resume;
        texte.appendChild(date); texte.appendChild(h3); texte.appendChild(horaire); texte.appendChild(resume);
        if (e.lien) {
          var a = document.createElement("a");
          a.className = "evenement-lien"; a.href = e.lien;
          a.target = "_blank"; a.rel = "noopener";
          a.textContent = (e.libelleLien || "En savoir plus") + " →";
          texte.appendChild(a);
        }
        carte.appendChild(texte);
        liste.appendChild(carte);
      });
      document.getElementById("agenda").hidden = false;
    })();
  </script>
  <script>
    (function () {
      "use strict";

      /* Les rubriques se déduisent des articles publiés : une rubrique
         apparaît avec son premier article et disparaît avec le dernier. */
      var RUBRIQUES = [];
      ARTICLES.forEach(function (a) {
        if (RUBRIQUES.indexOf(a.rubrique) === -1) RUBRIQUES.push(a.rubrique);
      });
      /* « Pour démarrer » juste après « Tout », le reste par ordre alphabétique */
      var EN_TETE = ["Pour démarrer"];
      RUBRIQUES.sort(function (a, b) {
        var ia = EN_TETE.indexOf(a), ib = EN_TETE.indexOf(b);
        if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
        return a.localeCompare(b, "fr");
      });

      /* Filtre présélectionnable par l'URL : /?r=Challenges
         (utilisé par le menu du bandeau sur les pages d'articles) */
      var active = null; // null = tout
      var param = new URLSearchParams(window.location.search).get("r");
      if (param && RUBRIQUES.indexOf(param) !== -1) active = param;

      var listeEl = document.getElementById("liste");
      var filtresEl = document.getElementById("filtres");

      var formatFR = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" });
      function dateLisible(iso) { return formatFR.format(new Date(iso + "T12:00:00")); }

      /* Épinglés d'abord (dans l'ordre d'articles.js), puis les
         autres par date, du plus récent au plus ancien */
      var articles = ARTICLES.slice().sort(function (a, b) {
        var pa = a.epingle ? 1 : 0, pb = b.epingle ? 1 : 0;
        if (pa !== pb) return pb - pa;
        if (pa && pb) return 0;
        return b.date.localeCompare(a.date);
      });

      function construireFiltres() {
        filtresEl.innerHTML = "";
        var tout = ["Tout"].concat(RUBRIQUES);
        tout.forEach(function (nom) {
          var li = document.createElement("li");
          var btn = document.createElement("button");
          btn.textContent = nom;
          var valeur = nom === "Tout" ? null : nom;
          if (valeur === active) btn.className = "actif";
          if (valeur === null && active === null) btn.className = "actif";
          btn.addEventListener("click", function () {
            active = valeur;
            construireFiltres();
            afficher();
          });
          li.appendChild(btn);
          filtresEl.appendChild(li);
        });
      }

      function afficher() {
        listeEl.innerHTML = "";
        var visibles = articles.filter(function (a) {
          return active === null || a.rubrique === active;
        });

        if (!visibles.length) {
          var p = document.createElement("p");
          p.className = "vide";
          p.textContent = "Rien dans cette rubrique pour le moment, ça arrive bientôt !";
          listeEl.appendChild(p);
          return;
        }

        visibles.forEach(function (a) {
          var carte = document.createElement("a");
          carte.className = "carte";
          carte.href = a.url;

          var meta = document.createElement("div");
          meta.className = "carte-meta";
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = a.rubrique;
          var date = document.createElement("span");
          date.textContent = dateLisible(a.date);
          meta.appendChild(chip);
          meta.appendChild(date);
          if (a.epingle) {
            var pin = document.createElement("span");
            pin.textContent = "📌 Épinglé";
            meta.appendChild(pin);
          }

          var h2 = document.createElement("h2");
          h2.textContent = a.titre;

          var resume = document.createElement("p");
          resume.textContent = a.resume;

          carte.appendChild(meta);
          carte.appendChild(h2);
          carte.appendChild(resume);
          listeEl.appendChild(carte);
        });
      }

      construireFiltres();
      afficher();
    })();
  </script>
  <script data-goatcounter="https://hygie.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <script src="assets/stats.js"></script>
</body>
</html>
